.main{font-size:21px;font-weight:700;margin:0 0 8px}
.main:before{content:"“";color:var(--acc)}.main:after{content:"”";color:var(--acc)}
.desc{margin:0 0 10px;color:var(--mute);font-size:16px}
.alts{display:flex;flex-wrap:wrap;gap:6px}
.alts span{font-size:15px;padding:3px 10px;border-radius:8px;background:var(--accsoft)}
b.ph{color:var(--ok);background:var(--oksoft);border-radius:5px;padding:0 5px;font-weight:700}
.tag{display:inline-block;margin-top:10px;font-size:14px;padding:2px 9px;border-radius:8px;background:var(--warnsoft);color:var(--warn)}
.tagv{background:var(--oksoft);color:var(--ok)}
.empty{padding:30px 0;color:var(--mute)}

const NOTAS={"Sistema y apps":"Abrir programas, páginas y controlar el volumen. Para apagar o bloquear, la app puede estar en modo prueba.","Navegación":"Moverte por la pantalla como con teclado. Di «lee» para escuchar el elemento actual.","Edición":"Copiar, pegar, borrar, seleccionar y mover el cursor del texto.","Formato":"Negrita, cursiva, subrayado y tamaño de letra. Funciona en Word, Excel y PowerPoint.","Documentos":"Crear, guardar con nombre y abrir documentos. Se guardan en Documentos, carpeta Mouth AI Live.","Dictado y búsqueda":"Después de «escribe» o «busca», di lo que quieras y se escribe tal cual.","Excel":"Libros, celdas y sumas. Al dictar en Excel, el texto va a la celda activa y baja una.","PowerPoint":"Diapositivas, títulos y presentación en pantalla completa.","Mouse":"Mover el puntero de a poco y hacer clic."};
const ORDEN=["Sistema y apps","Navegación","Dictado y búsqueda","Edición","Formato","Documentos","Excel","PowerPoint","Mouse"];
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ph=s=>esc(s).replace(/\[([^\]]+)\]/g,'<b class="ph">$1</b>');
let sel="Todas";
const pills=document.getElementById("pills");
["Todas",...ORDEN].forEach(n=>{const b=document.createElement("button");b.textContent=n;b.setAttribute("aria-pressed",n===sel);b.onclick=()=>{sel=n;[...pills.children].forEach(x=>x.setAttribute("aria-pressed",x===b));render()};pills.appendChild(b)});
function render(){
 const q=norm(document.getElementById("q").value.trim());
 const out=document.getElementById("out");let total=0,html="";
 ORDEN.forEach(c=>{
  if(sel!=="Todas"&&sel!==c)return;
  const its=DATA.filter(i=>i.c===c&&(!q||i.f.some(f=>norm(f).includes(q))||norm(i.d).includes(q)));
  if(!its.length)return;total+=its.reduce((n,i)=>n+i.f.length,0);
  html+=`<h2>${c}</h2><p class="note">${NOTAS[c]}</p><div class="grid">`+its.map(i=>`<div class="card"><p class="main">${ph(i.f[0])}</p><p class="desc">${esc(i.d)}</p><div class="alts">${i.f.slice(1).map(f=>`<span>${ph(f)}</span>`).join("")}</div>${i.v?'<span class="tag tagv">Tú dices el resto</span>':""}${i.r?'<span class="tag">Acción delicada: puede estar en modo prueba</span>':""}</div>`).join("")+`</div>`;
 });
 out.innerHTML=html||'<p class="empty">No hay frases con esa búsqueda. Prueba con una sola palabra.</p>';
 document.getElementById("count").textContent=total+" frases"+(q?" para «"+document.getElementById("q").value.trim()+"»":"");
}
document.getElementById("q").addEventListener("input",render);render();
</script>
